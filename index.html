    "README.md":  "# OSINT Mastery\n\nEverything I wish someone had handed me on day one. This folder is a complete working\neducation in Open Source Intelligence — from your first Google dork to writing reports\nthat get taken seriously.\n\nIt\u0027s written the way a practitioner would actually talk to you, not like a textbook.\nRead it in order the first time. After that, use it as a reference.\n\n---\n\n## How this is organized\n\n| Folder | What you\u0027ll learn |\n|---|---|\n| `01-foundations/` | What OSINT really is, the intelligence cycle, protecting yourself, staying legal |\n| `02-search-engines/` | Google dorking and every engine that isn\u0027t Google |\n| `03-people/` | Usernames, emails, phone numbers, faces and names |\n| `04-social-media/` | X/Twitter, Facebook, Instagram, LinkedIn, Reddit, TikTok, YouTube |\n| `05-images-video/` | Reverse image search, geolocating photos, EXIF metadata |\n| `06-domains-networks/` | WHOIS, DNS, IP intel, Shodan, website archives |\n| `07-business-crypto/` | Company registries, following money, blockchain tracing |\n| `08-geospatial/` | Satellite imagery, maps, planes, ships, vehicles |\n| `09-dark-web/` | Getting onto Tor safely and what\u0027s actually out there |\n| `10-toolkit/` | The big tool list plus how to build your investigation rig |\n| `11-career/` | **Certifications and jobs — start here if you want the title** |\n| `12-methodology/` | Turning findings into intelligence products people trust |\n\n---\n\n## If you want the OSINT title fast\n\nGo read `11-career/certifications.md`. Short version of the path:\n\n1. Work through this folder, doing every exercise for real.\n2. Do the free TryHackMe OSINT path and Bellingcat\u0027s challenges.\n3. Play a Trace Labs CTF (they find missing persons — real impact).\n4. Write up sanitized case studies publicly. This is your real CV.\n5. Sit the GOSI exam when you can afford it or an employer will pay.\n\n---\n\n## The one rule that governs everything here\n\nOnly investigate things you\u0027re legally allowed to investigate. Publicly available does\nnot mean consequence-free. Every file in here assumes you\u0027re doing defensive work,\nresearch, journalism, CTFs, or authorized investigations. Don\u0027t be the reason OSINT\ngets a bad name.\n\nNow open `01-foundations/what-osint-actually-is.md`.\n",
    "01-foundations/law-and-ethics.md":  "# Law and Ethics\n\nNot a lawyer, this isn\u0027t legal advice, laws differ by country — you\u0027ve heard the\ndisclaimer. Here\u0027s the practical map anyway, because investigators who skip this file\neventually become cautionary tales.\n\n## The core distinctions\n\n**Publicly available ≠ free to use however you want.**\nA person\u0027s address sitting in a public registry doesn\u0027t mean publishing it with\n\"look where this guy lives\" attached is lawful or decent. Context and intent change\neverything.\n\n**Access vs. use.**\nMost legal trouble in this field comes from *how* you got something, not that you\nhave it:\n\n- Viewing a public webpage: fine everywhere.\n- Logging in with your own account and scraping against Terms of Service: contract\n  territory, civil risk, platform bans. Gray zone, do it knowingly.\n- Bypassing paywalls, authentication, or access controls: this crosses into computer\n  misuse law (CFAA in the US, Computer Misuse Act in the UK, equivalents elsewhere).\n  Hard line. Don\u0027t.\n\n**Data protection law (GDPR and cousins).**\nIf you process personal data of EU/UK people, GDPR applies even to OSINT — journalism\nand crime prevention have exemptions, casual curiosity does not. Practical version:\ncollect only what the task requires, note why you collected it, delete when done.\n\n## Bright lines (never cross, no exceptions)\n\n- No unauthorized access to accounts, devices, or systems. Ever.\n- No impersonation of real people or officials.\n- No buying stolen/hacked data from criminal markets.\n- No targeting based on protected characteristics.\n- No harassment, threats, or intimidation dressed up as investigation.\n- No investigating minors beyond what a legitimate safeguarding role requires.\n\n## The gray zones (knowingly, documented)\n\n- **Password reset reveals** — using \"forgot password\" flows to see masked contact\n  info. Widely taught, legally contested, platform TOS violations. If you use these\n  techniques, understand you\u0027re in the gray and write down why.\n- **Breach data** — checking your own email in HaveIBeenPwned: fine. Searching\n  breach dumps for a subject\u0027s data: legally risky in many jurisdictions and toxic\n  evidence in any proceeding. Journalists handle this with counsel; so should you.\n- **Sock puppets** — violating platform TOS with fake accounts rarely brings criminal\n  risk but can nuke cases relying on the evidence. Courts dislike tainted methods.\n\n## Ethics checklist (run it before every engagement)\n\n1. Who asked for this and what\u0027s the lawful purpose?\n2. Could I achieve this with less intrusive collection?\n3. Would I be comfortable explaining every step to the subject, a judge, or my editor?\n4. Am I about to publish something that endangers someone?\n5. Have I separated facts from speculation in my conclusions?\n\nThat last question is where reputations are made. Plenty of technically correct\ninvestigations have destroyed innocent people because an analyst published a hunch\nas a finding. Confidence language exists for a reason — use it.\n\n## When you find something awful\n\nChild abuse material, credible threats, active planning of violence: stop collecting,\npreserve minimal evidence, report to the appropriate authority/platform. Don\u0027t\ninvestigate it yourself, don\u0027t share it, don\u0027t sit on it.\n",
    "01-foundations/the-intelligence-cycle.md":  "# The Intelligence Cycle\n\nRaw searching isn\u0027t intelligence work. Professionals run a loop that turns scattered\npublic fragments into decisions. It\u0027s called the intelligence cycle, and even an\ninformal version of it will put you ahead of 90% of \"OSINT researchers\" online.\n\n## The five phases\n\n**1. Direction (planning)**\nDefine the actual question before touching a search bar. \"Find everything on John\"\nis not a question. \"Determine whether John Smith, claiming to be a former Acme\nengineer, actually worked there\" is. Good requirements specify: who needs the\nanswer, what decision it supports, what would count as success, deadlines.\n\nWrite your Priority Intelligence Requirements down. They become your filter against\nrabbit holes — and this field is nothing but rabbit holes.\n\n**2. Collection**\nGather material against those requirements using everything in this folder: dorks,\nplatforms, registries, imagery. Log sources as you go (URL, timestamp, what you\nexpected to find). Collection without logging has to be redone later; it always has\nto be redone later.\n\n**3. Processing**\nRaw collected data → usable form. Translate, transcribe, organize into timelines,\nextract entities, convert formats. Unglamorous, essential. This is where Hunchly or\ndisciplined screenshot hygiene pays off.\n\n**4. Analysis**\nThe actual thinking: pattern recognition, link analysis, hypothesis testing,\nconfidence assessment. Techniques worth learning by name:\n\n- **ACH (Analysis of Competing Hypotheses)** — list every possible explanation,\n  systematically test evidence against each. Fights confirmation bias structurally.\n- **Timeline analysis** — contradictions reveal themselves in chronology constantly.\n- **Link analysis** — network graphs of people/orgs/assets with evidence-labeled edges.\n\n**5. Dissemination**\nDeliver the product (see `12-methodology/writing-it-up.md`) to whoever needed the\nanswer, at their level of detail.\n\nThen **feedback**: was it useful? What\u0027s missing? That reshapes next cycle\u0027s\ndirection. The loop continues as long as the question matters.\n\n## Evaluating everything you collect\n\nTwo questions for every source:\n\n1. **How reliable is this source?** (track record, independence, access)\n2. **How credible is this specific piece of information?** (corroborated?\n   internally consistent? plausible?)\n\nThe Admiralty shorthand (A1 through F6) exists so you can grade quickly and\nconsistently. A tweet from the subject themselves about their own location:\nreliable source (they know), credible info (why lie here?) — but note the\ndifference between that and a third party claiming the same thing.\n\n## Why the cycle matters in practice\n\nBecause undisciplined research produces confident nonsense. The person who \"did\nOSINT for six hours\" and returns with forty unvetted screenshots has less value\nthan the one who ran two focused cycles and returns with three assessed findings.\nDepth beats volume; structure beats enthusiasm.\n",
    "01-foundations/what-osint-actually-is.md":  "# What OSINT Actually Is\n\nOSINT stands for Open Source Intelligence. Strip away the mystique and it\u0027s this:\nanswering questions using information that\u0027s already out there, then packaging the\nanswer so someone can act on it.\n\nThe key word isn\u0027t \"open.\" It\u0027s \"intelligence.\" Anyone can Google something. An OSINT\npractitioner turns scattered public fragments into a defensible conclusion.\n\n## Where it gets used\n\n- **Journalism** — Bellingcat identified the Skripal poisoning suspects from travel\n  databases and leaked records. All public sources.\n- **Law enforcement** — missing persons cases, fraud rings, online predators.\n- **Corporate security** — knowing what attackers know about your company before they\n  use it against you.\n- **Fraud and AML teams** — banks investigating who\u0027s really behind an account.\n- **Penetration testing** — the recon phase. Most breaches start with public info.\n- **Trust and safety** — platforms investigating networks of fake accounts.\n\n## The flavors you\u0027ll hear about\n\n- **SOCMINT** — social media intelligence\n- **GEOINT** — geospatial (photos, satellite imagery, maps)\n- **FININT** — financial (corporate records, crypto, sanctions lists)\n- **TECHINT** — technical (domains, infrastructure, leaked credentials)\n\nMost real investigations blend all four within the first hour.\n\n## The mindset (this matters more than tools)\n\nThree habits separate practitioners from people who watch YouTube videos about OSINT:\n\n1. **Pivot thinking.** You never \"find a person.\" You find a username, which leads to\n   an email, which leads to a breach record, which leads to a phone number, which\n   confirms the original username. Everything is a thread to pull.\n\n2. **Document as you go.** Screenshot with timestamps and visible URLs. Save pages.\n   Six weeks from now you\u0027ll need to prove where a claim came from, and the page will\n   be deleted by then. It\u0027s always deleted by then.\n\n3. **Distrust yourself.** That perfect match on the first search? It\u0027s usually wrong.\n   Common names, reused usernames, coincidental photos — false positives are the\n   default state of this work. Verification is the job.\n\n## What OSINT is not\n\n- It\u0027s not hacking. No exploiting, no password guessing, no bypassing logins.\n- It\u0027s not doxxing. Publishing someone\u0027s home address to intimidate them is abuse,\n  not intelligence.\n- It\u0027s not magic. Half the craft is accepting \"I couldn\u0027t determine X\" as a valid\n  finding.\n\nNext: `the-intelligence-cycle.md` — how professionals structure the chaos.\n",
    "01-foundations/your-opsec-first.md":  "# Your OPSEC Comes First\n\nBefore you investigate anyone, understand this: sophisticated targets watch their own\nfootprints. View a LinkedIn profile logged in, and they see your name. Visit a site\nyou shouldn\u0027t have from your home IP, and it\u0027s in their logs forever. Get sloppy\nlinking your real identity to a sock puppet, and one careless click burns months of\nwork — maybe puts you in danger.\n\nThis file is about not becoming part of the story.\n\n## Layer 1: Network\n\n- **VPN from a reputable provider** (Mullvad, IVPN) for general browsing. Understand\n  what it does: hides your IP from the target, moves trust to the VPN provider.\n- **Separate connection for sensitive work** — mobile hotspot on a plan that isn\u0027t\n  tied to your name if the stakes justify it.\n- Never research hostile targets from corporate or university networks. Their SOC\n  sees everything.\n\n## Layer 2: Browser\n\n- **Dedicated browser profile** (or better, a separate browser) used only for\n  investigations. No personal extensions, no autofill, no saved passwords, no sync.\n- Firefox containers let you run multiple isolated sessions simultaneously — one per\n  persona. Free and effective.\n- Assume browser fingerprinting works. If a target runs tracking, a fresh profile\n  with your exact hardware/font/screen combo can still be recognized. Serious work\n  happens in VMs.\n\n## Layer 3: Machines\n\n- **Virtual machine snapshots** — snapshot before an op, roll back after. VirtualBox\n  is free; VMware Workstation Pro is now free for personal use too.\n- **Whonix** routes all VM traffic through Tor by design, for the heavy stuff.\n- For most work you don\u0027t need paranoia — you need separation. Personal life and\n  investigative life never share a login, ever.\n\n## Layer 4: Personas (sock puppets)\n\nWhen you need to interact — follow, friend, join a group, view stories — you use a\npersona:\n\n- Email created via a different network than the one you\u0027ll use daily.\n- A consistent fictional identity: name, birth year, city, interests. Write it down\n  and stay in character forever.\n- Profile photo: AI-generated faces are standard practice these days. Never use a\n  photo of a real person.\n- Age the account. Brand-new accounts viewing stories and joining groups stand out.\n  Create personas weeks before you need them.\n- **Never cross-contaminate.** One accidental login from your real account, one\n  shared username habit, one identical typo across personas — burned.\n\n## Layer 5: Behavior\n\n- Don\u0027t view Instagram stories, don\u0027t like posts, don\u0027t zoom-profile-view. Passive\n  collection only until interaction is truly necessary.\n- Match your persona\u0027s timezone and activity patterns.\n- Don\u0027t tell people what you\u0027re investigating. Not friends, not Discord servers.\n  Loose talk has ended careers and court cases.\n\n## Layer 6: Your notes and evidence\n\n- Case files in local-first tools (Obsidian, Joplin) rather than cloud docs tied to\n  your real name.\n- Encrypt anything sensitive (7-Zip AES or VeraCrypt volumes).\n- Screenshots should show URL bar and clock. Hash critical evidence files (SHA-256)\n  so you can prove they haven\u0027t been altered — this matters enormously if things go\n  legal.\n\n## The honest truth\n\nFull operational security is a spectrum, and cost scales with threat. Investigating a\nscam shop needs a VPN and a separate profile. Investigating a cartel needs a dedicated\nmachine bought with cash. Calibrate to the actual risk, but never drop below\n\"separate identity for interactions.\"\n",
    "02-search-engines/beyond-google.md":  "# Beyond Google\n\nHere\u0027s an uncomfortable fact: Google indexes well under half the web, and its index\nis actively hostile to some content types. Professionals run the same query across\nmultiple engines because each sees a different web.\n\n## The engines that matter\n\n**Yandex** — criminally underrated in the West. Russian company, different index,\ndramatically better than Google at two things: face similarity search and imagery\nfrom Eastern Europe/CIS regions. If you geolocate or identify people, Yandex Images\nis mandatory, full stop.\n\n**Bing** — Microsoft\u0027s index differs meaningfully from Google\u0027s. Better at some\ncorporate/document content, has its own `ip:` operator for finding sites on a server,\nand powers DuckDuckGo partially. Also: Bing still shows cached-ish views of some\npages Google won\u0027t touch.\n\n**DuckDuckGo** — privacy-friendly front end over Bing plus its own crawler. The killer\nfeature is **bangs**: type `!g query` for Google, `!b` for Bing, `!w` Wikipedia,\n`!yt` YouTube. It\u0027s a command line for the web. Set it as your default and stop\nswitching tabs.\n\n**Mojeek** — small UK engine with a genuinely independent index. Results are weaker\noverall but occasionally surface things literally nothing else has. Worth a pass when\nGoogle and Bing come up empty.\n\n**Startpage** — Google results through a proxy without tracking. Useful when you want\nGoogle\u0027s index but not Google\u0027s personalization or logging tied to your session.\n\n**SearXNG instances** — self-hostable metasearch that queries many engines at once.\nPublic instances exist everywhere; pick one that doesn\u0027t log.\n\n## Specialized search surfaces\n\nThese aren\u0027t general engines but they answer questions Google can\u0027t:\n\n- **Internet Archive (archive.org)** — deleted websites, old software, books.\n- **GitHub code search / grep.app** — code containing emails, keys, domains. Leaked\n  credentials in public repos are embarrassingly common.\n- **Google Scholar** — academic papers. Authors leave affiliations, co-authors, and\n  often contact emails. Great for expert identification.\n- **Telegram search** — telemetr.io and similar directories index channels. Huge in\n  certain regions and conflict zones.\n- **Paste sites** — pastebin-style sites host leaks and confessions. Search via\n  Google with `site:pastebin.com` or dedicated scrapers.\n\n## The multi-engine habit\n\nReal workflow for a person search, in order:\n\n1. Google (exact name in quotes + city + any known handle)\n2. Bing (same query — note what\u0027s new)\n3. Yandex (name AND photo if you have one)\n4. DuckDuckGo bangs for platform-specific sweeps\n5. Mojeek if everything above failed\n\nEach pass takes two minutes. One of them will usually break the case open, and it\u0027s\nrarely the same engine twice. That\u0027s the point.\n",
    "02-search-engines/google-like-a-pro.md":  "# Google Like a Pro\n\nEveryone uses Google. Almost nobody uses Google. The difference between the two is\nworth more than most paid tools, so learn this file properly.\n\n## The operators\n\n| Operator | What it does | Example |\n|---|---|---|\n| `\"exact phrase\"` | Forces exact match | `\"john rambo\" chicago` |\n| `site:` | Restrict to one domain | `site:acme.com email` |\n| `-word` | Exclude a term | `jaguar -car` |\n| `OR` | Either term | `resume OR cv \"data analyst\"` |\n| `filetype:` / `ext:` | File type filter | `filetype:xlsx password` |\n| `intitle:` | Word in page title | `intitle:\"index of\" backup` |\n| `inurl:` | Word in URL | `inurl:admin login` |\n| `intext:` | Word in body text | `intext:\"confidential\" filetype:pdf` |\n| `before:` / `after:` | Date ranges | `election results after:2024-01-01` |\n| `AROUND(n)` | Words within n words of each other | `\"ceo\" AROUND(3) \"resign\"` |\n| `related:` | Similar sites | `related:bellingcat.com` |\n\nCombine them. That\u0027s where the power is.\n\n## Dorks that earn their keep\n\nFind open directories (people misconfigure servers constantly):\n\n```\nintitle:\"index of\" \"backup\"\nintitle:\"index of\" \".env\"\n```\n\nExposed documents:\n\n```\nsite:target.com filetype:xlsx\nsite:target.com filetype:pdf \"internal use only\"\n```\n\nFind someone\u0027s profiles across sites:\n\n```\n\"john smith\" (site:linkedin.com/in OR site:x.com OR site:instagram.com)\n```\n\nFind documents mentioning an email or name anywhere:\n\n```\n\"j.smith@target.com\" -site:target.com\n```\n\nThat last pattern is underrated — it finds third parties who published your target\u0027s\nemail in meeting minutes, attendee lists, leaked spreadsheets.\n\n## Things most people don\u0027t know\n\n- **Google Cache died in early 2024.** Stop using `cache:` — it\u0027s gone. Use the Wayback\n  Machine instead (see `06-domains-networks/website-archives.md`).\n- **Verbatim mode** (Tools → All → Verbatim) stops Google \"helpfully\" ignoring your\n  operators and synonyms. Use it when precision matters.\n- **Autosuggest is free intel.** Type a name and see what completes — it reflects real\n  search behavior, sometimes revealing nicknames, scandals, or associations.\n- **Google Images / Lens** is a search engine too. Reverse searching is covered in\n  `05-images-video/` but know that Lens reads text inside images now — signs,\n  documents, handwriting.\n- **Search by date isn\u0027t reliable.** `before:/after:` filters by Google\u0027s date guess,\n  which is often the crawl date, not publication date. Verify manually.\n\n## Practice drill\n\nPick any company. In fifteen minutes, using only dorks, find: their org chart hints\n(site:linkedin.com/in), exposed files (filetype:), old versions of their site\n(archives), and any pastebin/leak mentions. Do this weekly against different targets\nuntil the syntax is muscle memory.\n",
    "03-people/email-addresses.md":  "# Email Addresses\n\nAn email address is one of the richest pivots you\u0027ll ever hold. It links breaches,\naccounts, domain registrations, and documents. This file covers finding them,\nverifying them, and squeezing them.\n\n## Finding emails\n\n**Pattern guessing.** Corporate emails follow formats: `j.smith@`, `jsmith@`,\n`john.smith@`, `smithj@`. Tools like Hunter.io show a company\u0027s dominant pattern and\nverify deliverability. Guess three ways, verify each.\n\n**Where emails leak into public view:**\n\n- GitHub commits — `git log` exposes author emails forever. Browse someone\u0027s repos,\n  check commit metadata. Shockingly effective for \"anonymous\" developers.\n- PDFs and docs — author metadata, contact pages, FOIA releases. Search dorks:\n  `\"@target.com\" filetype:pdf`\n- Conference attendee lists, court filings, whois records (pre-privacy era),\n  nonprofit board minutes, university directories.\n- Paste sites and forums signatures.\n\n**Email permutators** generate every plausible variant of a name; pair with\nverification below.\n\n## Verifying and enriching\n\n- **Holehe** (CLI) — checks whether an email is registered on 120+ sites without\n  triggering notifications. Tells you where the owner has accounts. Excellent.\n- **Epieos** — paste a Gmail address and it can reveal the linked Google account\n  name, plus registrations across services. Also shows Microsoft account linkage.\n  One of the few free tools that feels like cheating.\n- **emailrep.io** — reputation score: how exposed/spammy the address is.\n- **Gravatar** — `en.gravatar.com/EMAILHASH` may return the avatar and full name\n  users attached to that email. Hash = MD5 of the address.\n- **HaveIBeenPwned** — which breaches contain this address. Free for single lookups;\n  tells you what passwords/names might be associated (via breach names, not actual\n  passwords — HIBP never shows those).\n\n## Breach data — read this part carefully\n\nBreach search engines exist (DeHashed, Snusbase, IntelX and friends). Accessing\nstolen personal data carries real legal risk in many countries and poisons evidence.\nJournalists and authorized fraud investigators use these under legal cover. If\nthat\u0027s not you: stick to HaveIBeenPwned\u0027s legitimate interface and treat raw dumps\nas radioactive.\n\n## The gray-zone techniques (know what they are)\n\nPassword-reset flows reveal masked contact info (\"j•••@g•••.com\") confirming an\naccount exists on a platform. Widely taught, legally contested, TOS-violating. If\nyou use them, document justification and understand courts may exclude the fruit.\n\n## What to extract once verified\n\nRegistration footprint (Holehe/Epieos), breach exposure (HIBP), gravatar photo →\nreverse image search, username portion → feed back into `usernames.md`. Every answer\nshould spawn the next question.\n",
    "03-people/faces-and-names.md":  "# Faces and Names\n\nTwo directions here: you have a name and want everything attached to it, or you have\na face and want the name. Both are core skills. Both come with ethical weight.\n\n## Direction A: Name → Everything\n\nAssume nothing about spelling first. Search variants: Jon/Jonathan/John, hyphenated\nmaiden names, transliterations for non-Latin names.\n\n**People-search aggregators (US-heavy, free tiers):**\n- FastPeopleSearch, TruePeopleSearch, That\u0027sThem — these aggregate public records\n  and are unsettlingly good: current/past addresses, relatives, associated phones\n  and emails. Use for lawful investigations; these sites are exactly why OPSEC\n  exists, by the way — go look yourself up and feel motivated.\n\n**Public records:**\n- Voter registration (public in most US states, searchable in many)\n- Court records — PACER for US federal, state portals, CourtListener/RECAP (free\n  archive of federal filings)\n- Property records — county assessor/recorder sites (see 07-business-crypto/)\n- Obituaries and wedding announcements — legacy.com, local papers. Obituaries are\n  relationship maps: surviving family, cities lived in, maiden names.\n- Professional licenses — state boards (nurses, realtors, contractors) are public\n  and searchable.\n\n**International note:** much of Europe restricts this class of data hard (GDPR).\nUK electoral register is semi-public. Adjust expectations by jurisdiction.\n\n## Direction B: Face → Name\n\nRanked by practical effectiveness:\n\n1. **Yandex Images** — still the best free facial matching. Upload, crop tight to\n   the face, scan results. Finds social profiles with startling regularity.\n2. **PimEyes** — paid, powerful, controversial (it crawls faces aggressively).\n   Legitimate investigators use it; so do stalkers, which is why regulators circle\n   it. If you use it, have a documented lawful purpose.\n3. **FaceCheck.ID** — focuses on offenders/news/media indexes.\n4. **Google Lens** — weaker on pure face match but excellent when the face appears\n   in indexed articles/pages.\n\nTechnique matters: crop to just the face, try multiple crops, try grayscale if\nresults are noisy. A hit usually means the same photo was uploaded somewhere —\nfollow it to the profile, then confirm with convergent evidence (usernames.md\nrules apply).\n\n## Deepfake reality check\n\nFace swap tools are consumer-grade now. Before declaring \"this video proves X,\"\ncheck: lighting consistency, blink rates, teeth, ear shape, edge flicker around\njaw/hairline, and whether any *other* evidence corroborates. FotoForensics and\nInVID help but trained eyes beat tools here.\n\n## The ethics weight\n\nFace search is the technique most likely to be abused. Real-name-attribution of a\nprivate person should require: lawful purpose, convergent multi-source confirmation,\nand proportionate disclosure. Getting this wrong ruins innocent people — mixed-up\nface matches have led to harassment campaigns against completely uninvolved folks.\nBe the investigator who double-checks.\n",
    "03-people/phone-numbers.md":  "# Phone Numbers\n\nPhone numbers are stubborn identifiers — harder to rotate than emails, tied to SIMs,\nbanking, and two-factor everywhere. Here\u0027s how to work one.\n\n## Normalize first\n\nConvert to E.164 format: `+14155552671`. Search engines treat formats differently,\nso run queries multiple ways: `415-555-2671`, `(415) 555-2671`, `4155552671`,\n`+14155552671`. You\u0027d be surprised how often one format hits and others don\u0027t.\n\n## What the number itself tells you\n\n- **Country and carrier** — numlookup-style services and libphonenumber parse the\n  prefix: country, region (for landlines), carrier, line type (mobile/landline/VoIP).\n- **VoIP detection matters** — VoIP numbers are cheap burner identities; mobile\n  numbers tied to a carrier suggest a longer-lived identity worth pursuing.\n- Number recycling: prepaid numbers get recycled. Verify the current user actually\n  is who older records say before building conclusions.\n\n## Lookup tools\n\n- **Truecaller / sync.me** — crowdsourced caller ID. Massive databases, often shows\n  the registered name. App-based, freemium.\n- **PhoneInfoga** (CLI) — scans number footprint across free sources, identifies\n  carriers/types, checks disposable-number databases.\n- **Google the number in all formats** — complaint boards, business listings, WhatsApp\n  group invites, classified ads. Classified ads are gold: sellers expose numbers next\n  to photos, cities, and other items for sale.\n\n## Messaging app probing\n\nSave the number as a contact, then:\n\n- **WhatsApp** — does an account exist? Profile photo, about text, last-seen settings.\n  Photos reverse-search well. Business accounts show category and address sometimes.\n- **Telegram** — similar; username attached to the number is a direct pivot into\n  `usernames.md`.\n- **Signal** — existence check only, no metadata shown. Still useful to confirm\n  registration.\n\nThis is passive collection — the target gets no notification that you saved their\nnumber. Interacting (messaging) is a different story entirely.\n\n## Gray zone, flagged honestly\n\nPassword-reset flows on some platforms reveal masked digits of linked numbers;\nbreach dumps contain full numbers. Both carry the legal/TOS caveats covered in\n`01-foundations/law-and-ethics.md`. Use judgment, document purpose.\n\n## Where numbers lead\n\nNumber → WhatsApp photo → face search → social profile → bio with email → breach\ncheck → password reuse patterns... you know the drill by now. Also remember numbers\nas *geolocation clues*: country codes and regional prefixes narrow location when a\nsubject claims to be elsewhere.\n",
    "03-people/usernames.md":  "# Usernames\n\nPeople are creatures of habit. The handle they made at fourteen follows them for\ntwenty years across platforms they forgot they joined. Username pivoting exploits\nthis, and it\u0027s usually the fastest thread to pull when you have almost nothing.\n\n## The core technique\n\nTake any known handle — `darkwolf42`, `sarah.builds`, whatever — and check it across\nhundreds of platforms simultaneously:\n\n- **WhatsMyName** (whatsmyname.app) — the community-maintained standard. Web app and\n  the list behind it power most other tools. Start here.\n- **Sherlock** (CLI) — checks a username across 400+ sites. Noisy but fast.\n- **Maigret** — Sherlock\u0027s more refined cousin; builds a report page with profile\n  info extracted from found accounts.\n- **Blackbird** — fast, includes some breach-correlation features.\n- **InstantUsername / NameCheckr** — quick web checks on major platforms.\n\n## False positives are the enemy\n\nA hit means \"someone uses this handle there,\" not \"my target is this person.\"\nCommon handles collide constantly. Verification checklist before you accept a match:\n\n1. **Avatar consistency** — same or similar photos? Reverse-search them.\n2. **Bio overlap** — same city, job, birthday, links?\n3. **Writing style** — punctuation habits, slang, emoji use are fingerprints.\n4. **Timeline plausibility** — account created around when your subject was active\n   elsewhere? Dead account from 2011 probably isn\u0027t them.\n5. **Cross-links** — does one profile link to another? Chain of custody established.\n\nTwo independent confirmations minimum. Three for anything you\u0027ll publish.\n\n## Variations to try\n\n- Exact handle\n- With/without separators: `sarah_builds`, `sarahbuilds`, `sarahbuilds`\n- Leetspeak variants: `s4rah`\n- Handle + birth year: `sarahbuilds95`\n- Reversed: `buildssarah`\n\nAutomated tools only test the exact string. The variants are manual work, and\nthey\u0027re where the wins hide.\n\n## Where the handle leads\n\nFound profiles → bio emails → breach lookups → photos → geolocation clues → friend\nnetworks. Also work backwards: emails often contain handles (`jsmith92@` implies\n`jsmith92`), and real names generate predictable handle patterns worth testing.\n\nOne warning: if you\u0027re checking whether *your own* handles are exposed (you should),\ndon\u0027t run tools from accounts/identities you care about — some platforms flag bulk\nchecks as suspicious activity.\n",
    "04-social-media/linkedin.md":  "# LinkedIn\n\nLinkedIn knows where everyone works and hates letting you see it without logging in.\nThe craft is getting around that politely.\n\n## X-ray search (the essential technique)\n\nGoogle indexes profiles despite the login wall:\n\n```\nsite:linkedin.com/in \"john smith\" chicago\nsite:linkedin.com/in \"acme corp\" (\"engineer\" OR \"director\")\nsite:linkedin.com \"acme corp\" \"python\" -inurl:dir   # skills mentions\n```\n\nThis avoids login entirely and doesn\u0027t notify anyone. It\u0027s 80% of LinkedIn OSINT.\n\n**Recruit\u0027em** and similar tools build these query strings for you across Google,\nBing, and Yahoo simultaneously.\n\n## Company intelligence\n\n- **Employee counts over time** — Wayback Machine snapshots of company pages reveal\n  headcount trends: growth spurts, silent layoffs, department sizes.\n- **Job postings** — reveal tech stack, expansion plans, internal tooling names,\n  sometimes salary bands. Current AND archived postings both matter.\n- **Alumni mining** — school alumni pages and `site:linkedin.com/in` + university +\n  graduation year find people who\u0027ve scrubbed their current employer mention.\n- **Departure patterns** — ex-employees talk. Search `\"ex-acme\"` or former employees\u0027\n  posts about the company; Glassdoor reviews add culture context.\n\n## The notification problem\n\nViewing profiles while logged in tells the person unless you have anonymous mode\n(partially hides you) — and anonymous mode blocks seeing who viewed you back, which\nrecruiters notice. Options:\n\n1. Stay logged out, live on x-ray search (cleanest).\n2. Sock puppet recruiter persona — effective, common, TOS-violating, burns if the\n   target checks your fake profile too closely.\n3. Your real identity — only when overt contact is fine anyway.\n\n## What LinkedIn uniquely gives you\n\n- Employment history verification (the anti-fraud use case)\n- Org charts built from manager/report relationships in job titles\n- Conference talks, patents, publications listed under profiles\n- Skills endorsements revealing what someone actually works with\n\n## Cross-reference everything\n\nLinkedIn claims are self-reported resumes — people inflate. Verify employers against\ncompany registries (07-business-crypto/), conference attendee lists, GitHub commit\nhistories, and publication records before treating any claim as fact.\n",
    "04-social-media/meta-facebook-instagram.md":  "# Facebook \u0026 Instagram\n\nMeta platforms are locked down harder than anywhere else, but they hold the richest\nreal-identity data on earth. You work around the walls.\n\n## Facebook\n\n**X-ray search first.** Google sees pages login-walls hide:\n\n```\nsite:facebook.com \"John Smith\" \"Chicago\"\nsite:facebook.com \"John Smith\" (site:facebook.com/groups OR site:facebook.com/pages)\n```\n\n**Page Transparency** — every page\u0027s tab shows ad spend, country of admins, and\nhistory. Fake \"local business\" pages run from elsewhere get exposed here instantly.\nThe Ad Library (facebook.com/ads/library) is free and searchable without login —\npolitical and issue ads especially are a treasure trove.\n\n**mbasic.facebook.com / m.facebook.com** — stripped-down mobile versions sometimes\nrender content the main site login-walls. Flaky, but costs nothing to try.\n\n**Groups** — membership lists are mostly hidden now, but group *posts* by a subject\nare x-ray searchable. Niche hobby groups are where fake personas slip up: the\nscammer using a stock photo still posts in a fishing group about their real life.\n\n**Photos** — uploaders\u0027 tagged photos surface via Google Images with\n`site:facebook.com` queries even when in-platform search won\u0027t show them.\n\n## Instagram\n\n**Profile photo full-size trick** — replace nothing, just right-click → open image\nin new tab, or use `imginn`-style viewers (they churn constantly; current ones found\nvia \"instagram viewer\" searches — never log in through any of them).\n\n**Tagged photos** — visible on web profiles under the tagged tab for public accounts.\nTags map real-world relationships better than followers do.\n\n**Stories require login** — this is where sock puppets earn their keep (see\n01-foundations/your-opsec-first.md). Aged persona account, passive viewing only,\nnever interact from anything connected to you.\n\n**Instaloader** (CLI) — archives public profiles: posts, captions, comments.\nCaptions matter: locations geotagged in old posts, friends named in captions,\nroutines described over months of posting.\n\n## The relationship-mapping principle\n\nOn both platforms, **commenters \u003e followers**. Followers are noise; consistent\ncommenters/likers between two accounts prove connection. Build network maps from\ninteraction patterns, not friend counts.\n\n## The burn warning\n\nEverything here assumes passive collection. The moment you follow, like, or view\nstories from an account, you\u0027ve told the target someone is looking. Decide that\u0027s\nacceptable *before* doing it, not after.\n",
    "04-social-media/reddit-tiktok-youtube.md":  "# Reddit, TikTok \u0026 YouTube\n\nThe pseudonymous platforms. People say things here they\u0027d never attach to their\nFacebook — which makes them invaluable and dangerous in equal measure.\n\n## Reddit\n\n**Pullpush.io** — the successor to Pushshift, the legendary archive of essentially\nall Reddit comments/posts. Query any username\u0027s full history, search comments by\nkeyword/subreddit/date. This is the single most powerful Reddit tool; learn its API\nsyntax.\n\n**Redditsearch-style UIs** — friendlier frontends over similar data for quick manual\nsearches.\n\n**Old.reddit.com** — the old interface exposes things new Reddit hides: full comment\nhistories are easier to traverse, some removed content shows `[removed]` vs\n`[deleted]` distinctions that matter (removed by mods = recoverable via archives;\ndeleted by user = gone).\n\n**Reveddit / rareddit patterns** — show what was removed and where.\n\n**User analysis technique:** a target\u0027s comment history is a psychological profile —\nlocations mentioned casually (\"my commute to Austin\"), complaints about employers,\nhobbies, medical details, arguments they lost. Sort by controversial; people\u0027s\nworst moments are their most identifying.\n\n**Subreddit overlap** — users active in r/OSINT AND r/farming tell you something.\nTools exist for subreddit-overlap mapping; or just read post histories manually.\n\n## TikTok\n\n- **Web viewers** (urlebird-type) browse public profiles without the app. They break\n  often; find live ones via current searches.\n- **Geotagged content** — TikTok location pages aggregate videos filmed at specific\n  places. Useful both for finding a subject\u0027s haunts and for geolocating *other*\n  footage.\n- **Download without watermark** tools preserve original quality for frame analysis\n  (05-images-video/).\n- Comments on local viral videos are full of locals confirming locations — useful\n  during geolocation challenges.\n\n## YouTube\n\n**Mattw\u0027s YouTube Geofind** — searches videos by geotag coordinates/radius. When\nsomeone films an event, Geofind finds every angle of it.\n\n**Comment mining** — comment search tools and simple `site:youtube.com` dorks find\nwhere a name/handle appears across millions of comments. Commenters leave emails in\n\"business inquiries\" lines constantly.\n\n**Channel intelligence** — Social Blade for stats/trends; \"About\" tab reveals linked\naccounts; community posts leak opinions between uploads.\n\n**yt-dlp** — download everything: videos, subtitles (mined for names/places),\nmetadata including GPS tags on some mobile uploads. Archive early, subjects delete.\n\n## The cross-platform habit\n\nBios link everything now — Linktree, Beacons, Carrd pages consolidate someone\u0027s\nentire footprint behind one URL. When you find one platform account, hunt for the\nlink-in-bio page first; it usually hands you every other account voluntarily.\n",
    "04-social-media/x-twitter.md":  "# X / Twitter\n\nX (still \"Twitter\" in your muscle memory) got much harder after the 2023 API lockdown.\nMost classic tools died. The platform remains an intelligence goldmine anyway — you\njust work differently now.\n\n## What still works\n\n**Advanced search operators** — still the backbone, partially available logged-out,\nfully logged-in:\n\n```\nfrom:username since:2024-01-01 until:2024-06-01\nfrom:username filter:replies min_faves:10\n\"exact phrase\" geocode:51.5074,-0.1278,10km\nto:username -from:username          # conversations they\u0027re in\nfrom:username filter:media          # their images/video\n```\n\nSearch replies and likes — people reveal allegiances in replies they\u0027d never post\nas original content.\n\n**Direct URL patterns** — even with search degraded, hitting\n`x.com/username/status/ID` directly works. Old tweet IDs can be enumerated and fed\nto archives.\n\n**The Wayback Machine** — profiles and tweets get snapshotted. Deleted tweets often\nsurvive here and on archive.today. Search both by profile URL and by direct status\nURLs found anywhere.\n\n**accountanalysis.app** — account stats, posting patterns, growth anomalies. Useful\nfor spotting bot networks and persona accounts.\n\n## What died (so you don\u0027t waste time)\n\n- Nitter instances — mostly dead since early 2024 API changes.\n- Twint, snscrape — broken against current X.\n- Free API access — gone; paid tiers exist for serious tooling.\n\nThird-party viewer sites (twstalker-style) appear and vanish monthly. Treat them as\nuntrusted: never log in through them, assume they log everything.\n\n## Strategy notes\n\n- **Follower/following overlap** is how you confirm alias networks. Two accounts\n  sharing an unusual follower cluster likely share an operator.\n- **Pinned tweets and bios** change over time — archive them early in an engagement;\n  subjects scrub histories once alerted.\n- **Community Notes, quote tweets** — quote tweets of a controversial post surface\n  critics and supporters alike; great for mapping opinion networks around a subject.\n- **Lists** — public lists others built about a topic/community are pre-made\n  intelligence collections. Search `\"list\"` mentions of key terms.\n\n## Cross-platform reality\n\nX bios link everywhere: Linktree, Telegram channels, GitHub. Follow every outbound\nlink. And remember X posts get indexed by Google — dorks like\n`site:x.com \"username\" \"email\"` sometimes surface things platform search hides.\n",
    "05-images-video/geolocating-photos.md":  "# Geolocating Photos\n\nThe flagship OSINT skill. Given a photo with no context, determine where on Earth it\nwas taken. Bellingcat made this famous; Trace Labs cases get solved with it daily.\nIt looks like magic from outside and like methodical checklist work from inside.\n\n## The method: catalog, hypothesize, verify\n\n**Step 1 — Catalog every clue.** Before any searching, list what the image contains:\n\n- Text: signs, shop names, license plates, phone numbers (country codes!), language,\n  script direction, dialect\n- Vehicles: makes common in region, plate formats/colors, which side of road cars\n  drive on\n- Infrastructure: utility pole styles, bollard types, fire hydrant designs, manhole\n  covers, road line colors, guardrail styles — every country has signatures\n- Nature: vegetation, terrain, sun position/shadow length (time + hemisphere),\n  snow/rain patterns\n- Architecture: brick types, roof styles, window shapes, construction era\n\n**Step 2 — Hypothesize a region.** Language + plates + driving side usually narrow\nto a country or three within minutes.\n\n**Step 3 — Verify against street-level imagery.** Google Street View, Yandex Maps\n(better for CIS), Apple Look Around, Mapillary/KartaView (crowdsourced, covers where\nGoogle doesn\u0027t). Walk virtual streets until signage matches. Then match building\nfacades exactly.\n\n## The tools that do heavy lifting\n\n- **Google Earth Pro** (free desktop app) — historical imagery slider is gold:\n  compare locations across years to confirm construction timelines.\n- **SunCalc.org** — given shadow direction/length, computes time-of-day/date and\n  confirms hemisphere. Shadows don\u0027t lie; people do.\n- **PeakVisor / PeakBagger** — mountain skyline identification. A visible ridgeline\n  can pin you within kilometers.\n- **OpenStreetMap + Overpass Turbo** — query \"all water towers within 5km of X\" style\n  questions. When you need \"which of these 40 towns has a blue mosque AND a rail\n  line,\" Overpass answers.\n- **Sentinel Hub Playground / Copernicus Browser** — free satellite imagery at 10m\n  resolution, updated every few days. For recent events where Street View is stale.\n\n## Worked example (abbreviated)\n\nPhoto of a market street. Cyrillic signage but Latin \"PIZZA\" sign → Balkans? Red\nplate with regional code format → Serbia. Trolleybus wires → city with trolleybuses.\nOverpass query narrows Serbian trolleybus cities to Belgrade. Street View walking\nalong the market until the yellow facade matches. Done: coordinates found in under\nan hour.\n\n## Training resources\n\n- **GeoGuessr** daily challenges — the standard trainer\n- **Plonk It guide** — free, systematic country-by-country meta (meta = identifying\n  clues like camera generation, car meta, domain colors)\n- **Quiztime** — real quizzes from professional geolocators\n- **Bellingcat\u0027s geolocation challenges** — actual published case work\n\nDo GeoGuessr daily for a month and you\u0027ll never look at a photo the same way again.\nThat\u0027s not a figure of speech — you\u0027ll start reading utility poles at breakfast.\n",
    "05-images-video/metadata-exif.md":  "# Metadata \u0026 EXIF\n\nMetadata is data about data — and files leak it constantly. Sometimes it hands you\nGPS coordinates directly. More often it gives timestamps, devices, and authorship.\n\n## EXIF in photos\n\nExchangeable Image File Format data rides inside JPEGs/TIFFs/RAWs:\n\n- **GPS coordinates** (when location services were on) — the jackpot\n- Device make/model, lens, settings\n- Exact capture timestamp (including timezone quirks)\n- Editing software versions\n- Embedded thumbnails — forensically interesting because the thumbnail sometimes\n  predates edits, revealing the original image after someone cropped/blacked-out\n  regions. Real leaks have happened this way.\n\n## The tools\n\n- **ExifTool** — the industry standard, reads/writes everything. Command line:\n  `exiftool photo.jpg`. If you learn one tool from this folder, make it this one.\n- **Jeffrey\u0027s EXIF Viewer** (online) — ExifTool with a web interface.\n- **metadata2go** — quick online checks for video/audio too.\n\n## The reality check\n\nWhatsApp strips EXIF. Facebook strips EXIF. Instagram strips EXIF. Most platforms\nscrub metadata on upload — so the technique works mainly on:\n\n- Original files shared directly (email attachments, Discord uploads sometimes,\n  file-sharing links, messaging apps that preserve originals)\n- Forum uploads by people who don\u0027t know better\n- Files from breaches/dumps\n- Your own evidence collection\n\nAlways check. Costs ten seconds when it\u0027s absent; wins cases when it\u0027s there.\n\n## Document metadata — the underrated sibling\n\nOffice documents and PDFs carry their own ghosts:\n\n- Author name, company, machine paths (`C:\\Users\\jsmith\\...`)\n- Revision history showing edits and contributors\n- Template fingerprints linking documents to organizations\n- Hidden comments/tracked changes not visible in print view\n\nBellingcat has repeatedly identified officials through document metadata in leaked\nfiles. PDFs especially hold revision logs nobody remembers they\u0027re publishing.\n\nTools: ExifTool handles these too; `pdfinfo`; opening docx as zip archives and\nreading `docProps/core.xml` directly.\n\n## Video metadata\n\nMP4/MOV containers store device info, GPS (some phones), creation dates. yt-dlp\npulls platform-side metadata separately (upload date, geotags if creator enabled).\n\n## Ethics note, briefly\n\nReading metadata from a file someone gave you access to: fine. Extracting it to\nstalk someone\u0027s home address from their selfie: that\u0027s the behavior this whole\nfolder exists to prevent. Coordinates you find should serve the lawful purpose you\ndocumented at the start.\n",
    "05-images-video/reverse-image-search.md":  "# Reverse Image Search\n\nPhotos answer questions text can\u0027t: Is this profile fake? Where was this taken? Has\nthis image been recycled from something else? The skill is knowing which engine and\nhow to iterate.\n\n## The engines, ranked by use case\n\n| Engine | Best at |\n|---|---|\n| **Yandex Images** | Faces, Eastern Europe/CIS content, finding same-photo-different-name |\n| **Google Lens** | Objects, landmarks, text inside images, products |\n| **Bing Visual Search** | Products, some Western social profiles |\n| **TinEye** | Finding *originals* — sort by oldest to trace provenance |\n\nThey index different webs entirely. Always run at least Yandex + Google + TinEye.\nProfessionals keep all four open in tabs as standard practice.\n\n## Technique beats tooling\n\n1. **Crop aggressively.** Full photos fail; tight crops of distinctive elements hit.\n   Crop the face alone. Then the tattoo. Then the sign in the background. Each crop\n   is a separate search.\n2. **Sort TinEye by oldest** — the earliest appearance is usually the true origin.\n   A \"soldier\u0027s photo\" from 2016 appearing in 2013 tells you it\u0027s stolen.\n3. **Iterate.** Results give you new keywords → new searches → better crops. It\u0027s a\n   loop, not a lookup.\n4. **Grayscale/color flip** occasionally breaks through when engines fixate on color\n   noise.\n\n## Classic applications\n\n**Fake profile detection:** subject\u0027s photo appears years earlier under a different\nname, or belongs to a model/influencer. Instant verdict.\n\n**Scam tracing:** romance-scam photos get reused across dozens of victims\u0027 reports —\nimage search surfaces complaint threads with the same face.\n\n**Event verification:** photo claimed to be from today\u0027s protest actually indexed\nfrom 2019. Check earliest date before believing any viral claim.\n\n**Meme/disinfo origin tracing:** work backwards through reposts to patient zero.\n\n## Video too\n\n**InVID/WeVerify browser extension** — splits video into keyframes, then pushes each\nframe to multiple reverse engines simultaneously. Standard tool for verifying viral\nclips. Built by journalism-tech folks; free.\n\n**FotoForensics** — Error Level Analysis for spotting spliced/edited regions. Noisy\nand often misread by beginners — treat ELA as a hint requiring corroboration, never\nas proof.\n\n## Practice resources\n\nQuiztime (Twitter/X quiz community), Bellingcat\u0027s verification exercises, GeoGuessr\nfor the geography side. Do these weekly; image forensics is a reps-and-sets skill.\n",
    "06-domains-networks/website-archives.md":  "# Website Archives\n\nThe web forgets nothing — if you know where it stores its memory. Archives turn\n\"that page never existed\" into \"here\u0027s exactly what it said in March 2021.\"\n\n## The Wayback Machine (web.archive.org)\n\nThe heavyweight. What people don\u0027t know:\n\n- **CDX API** — query every captured URL matching a pattern:\n  `web.archive.org/cdx/search/cdx?url=target.com/*\u0026output=text\u0026fl=timestamp,original`\n  Lists everything ever archived from a domain. Overwhelming and wonderful.\n- **Save Page Now** — archive a page *right now* before someone deletes it. Do this\n  reflexively during any investigation. Timestamped preservation you can cite later.\n- **Snapshot calendars** — the URL bar shows capture density per year; gaps tell\n  stories too (a company page vanishing for six months means something).\n- **Diffing** — compare snapshots manually or with text-diff tools to see exactly\n  when wording changed. Policy pages, team pages, and pricing pages reveal strategy\n  through their edits.\n\n## archive.today (archive.ph)\n\nCaptures pages Wayback struggles with: JavaScript-heavy content, pages behind some\npaywalls, anything robots.txt-blocked. No save-on-demand API abuse concerns — just\npaste a URL. Slower but stubbornly thorough. Different crawler = different coverage;\nalways check both.\n\n## Memento Time Travel\n\ntimetravel.mementoweb.org aggregates multiple archives simultaneously — one query,\nevery archive\u0027s coverage. Good first check before diving into individual services.\n\n## What archives actually get used for\n\n- **Deleted posts/tweets/profiles** — subjects scrub after the fact; snapshots\n  remember\n- **Team page archaeology** — former employees listed before they left (names for\n  LinkedIn x-ray searching)\n- **Price/history verification** — fraud cases, \"it used to say X\"\n- **Defunct companies** — dissolved businesses still leave archived footprints,\n  contacts, filings\n- **Changed terms/policies** — legal disputes over what was promised when\n\n## Google Cache is dead\n\nKilled in early 2024. Any tutorial telling you otherwise is outdated. Bing\u0027s cache\nlimps along inconsistently. The archives above are the reliable path now.\n\n## Habits worth building\n\n1. Archive anything important the moment you see it (both services).\n2. Screenshot with visible URL + timestamp as backup.\n3. Note archive URLs in your case file — evidence needs provenance.\n4. Check archives BEFORE contacting/alerting anyone at the target organization.\n",
    "06-domains-networks/whois-dns-ip.md":  "# WHOIS, DNS \u0026 IP Intelligence\n\nEvery domain and IP address leaves records. This is the technical backbone of\ninvestigating websites, scams, phishing infrastructure, and anonymous actors.\n\n## WHOIS — who registered a domain\n\n- **ICANN Lookup / who.is / whoisds** — registration date, registrar, name servers,\n  contact info (when not redacted).\n- **Privacy proxies are normal now** (post-GDPR most registrations hide owners).\n  The play: **historical WHOIS** via DomainTools, SecurityTrails, or WhoisXML —\n  pre-2018 records often show real names/emails. Old whois data convicts phishers\n  weekly.\n- **Registration patterns** — domains registered in bulk batches, or seconds apart,\n  link to the same operator. Registrars\u0027 creation dates are free timeline evidence.\n\n## DNS records — what a domain points to\n\n- **DNSDumpster** — free visual map of a domain\u0027s DNS footprint: subdomains, mail\n  servers, hosting. First stop always.\n- **SecurityTrails** — historical DNS: every IP the domain ever resolved to, deleted\n  subdomains, old nameservers. Historical pivots find sibling sites of scammers.\n- **ViewDNS.info** — reverse IP lookup: what else lives on this server? Shared\n  hosting neighbors often share an operator.\n- **crt.sh** — certificate transparency logs. Every SSL cert issued for a domain is\n  logged forever, including internal subdomains like `dev.target.com` nobody meant\n  to publish. Subdomain enumeration goldmine; costs nothing.\n\n## IP intelligence\n\n- **Shodan** — search engine for internet-connected devices. Find exposed cameras,\n  databases, industrial systems, and fingerprint servers by banner. Also great:\n  `ssl.cert.subject.CN:target.com` finds servers by certificate even on different IPs.\n- **Censys** — Shodan\u0027s academic cousin, arguably better structured data.\n- **ipinfo.io / bgp.he.net** — ASN ownership, hosting provider, geographic data.\n  bgp.he.net is underrated for mapping network relationships.\n- **AbuseIPDB** — reputation: has this IP been reported for attacks/spam?\n\n## Pivoting infrastructure\n\nThe pro move is linking supposedly-unrelated assets:\n\n1. **Same Analytics/Meta pixel IDs** across sites → same operator (PublicWWW searches\n   source code for these snippets).\n2. **Favicon hashes** — Shodan matches servers by favicon hash; lazy phishers reuse.\n3. **Identical whois email + different domain** → historical records again.\n4. **Shared IP history** via SecurityTrails timelines.\n5. **Code reuse** — PublicWWW/Wappalyzer fingerprint tech stacks; identical custom\n   code = same developer.\n\n## theHarvester \u0026 Amass\n\nCLI classics for bulk collection: emails, subdomains, hosts from public sources\n(search engines, cert logs, DNS). Amass does deep enumeration for authorized\nengagements. Both free, both in Kali, both worth learning properly.\n\n## Legal note\n\nAll of the above queries public records about infrastructure — fully legal. Active\nscanning/port-knocking targets crosses into authorization-required territory\n(see 01-foundations/law-and-ethics.md). Passive recon only unless you have permission.\n",
    "07-business-crypto/company-records.md":  "# Company Records\n\nCorporate registries are public by design — transparency laws mean most companies\nmust disclose who owns and runs them. Most people never look. You will.\n\n## The registries that matter\n\n**OpenCorporates** — 200+ million companies from registries worldwide, searchable in\none place. Directors, registered agents, filing histories. The aggregator start point.\n\n**UK Companies House** — the world\u0027s most useful free registry: every UK company\u0027s\nfilings, accounts, officer lists, AND the **PSC register** (People with Significant\nControl) naming actual beneficial owners. Journalists call it a cheat code for a\nreason.\n\n**US state Secretary of State sites** — Delaware (opaque ownership, millions of\nshells), Wyoming, Nevada are the classic formation states; each has its own search.\nNo federal registry exists, which is itself the loophole.\n\n**SEC EDGAR** — US public company filings: annual reports (10-K), executive\ncompensation, major shareholder disclosures (13D/13F), insider trading forms.\nFull-text search finds names across decades of filings.\n\n**EU BRIS** — European branch registers interconnection. Patchy but improving.\n\n**OCCRP Aleph** — investigative consortium\u0027s database combining registries, sanctions\nlists, leaked databases (Panama Papers et al.), and documents. Free for researchers;\narguably the single most powerful corporate research tool that exists.\n\n**ICIJ Offshore Leaks** — searchable index of the Panama/Paradise/Pandora Papers.\nIf an entity appears here, the leaks contain its real paperwork.\n\n## Sanctions and watchlists\n\n- **OpenSanctions** — aggregates OFAC SDN, EU, UN lists plus PEPs (politically\n  exposed persons) into one searchable database. Standard due-diligence tool.\n- **OFAC Sanctions List Search** — the primary US list directly.\n\n## Courts\n\n- **PACER** — US federal cases (~$0.10/page, fee waivers under threshold)\n- **CourtListener / RECAP** — free archive of documents others already paid for\n- State courts vary wildly; most have at least name-searchable civil/criminal indices\n\n## The techniques\n\n1. **Officer cross-referencing** — same director across 15 companies = shell network.\n   Map it visually (Maltego or draw.io).\n2. **Registered agent addresses** — thousands of companies at one address = mass\n   formation agent, not evidence of anything alone; but your target\u0027s LLC sharing\n   an address with known bad actors is a lead.\n3. **Filing timelines** — incorporation right before a contract award, dissolution\n   right after a lawsuit: chronology is narrative.\n4. **Follow the accountants** — the same audit firm/signatory recurring across\n   entities links networks owners tried to keep separate.\n\n## Glassdoor/Indeed side-channel\n\nEmployee reviews complain about specific clients, projects, and internal scandals\nwith dates. Unofficial, biased, occasionally brilliant.\n",
    "07-business-crypto/crypto-tracing.md":  "# Crypto Tracing\n\nBlockchains are public ledgers — every transaction forever, visible to anyone. The\npseudonymity of wallet addresses fools people into thinking they\u0027re invisible.\nThey\u0027re not. This is FININT\u0027s most technical corner.\n\n## The mental model\n\n- A **wallet address** is a pseudonym, not a person.\n- The **ledger** shows every movement between pseudonyms ever.\n- Your job: cluster addresses belonging to one actor, then find where clusters touch\n  the real world (exchanges requiring KYC, posted addresses, known labels).\n\n## Bitcoin\n\nExplorers: **mempool.space** (clean UI), blockchain.com/explorer.\n\nTechniques:\n\n- **Common-input ownership heuristic** — when one transaction spends multiple inputs,\n  those inputs almost certainly share one owner (only the owner can combine them).\n  This powers most clustering.\n- **Change address tracking** — payments split into \"amount to recipient + remainder\n  back to self.\" Following change chains follows the actor.\n- **Labels** — ChainAbuse.com community reports mark scam/known addresses;\n  mempool.space shows some entity labels.\n\n## Ethereum \u0026 EVM chains (where the easy wins live)\n\n**Etherscan** is your home base:\n\n- Address labels/tags name exchange wallets, mixers, known exploiters\n- Every token/NFT transfer visible — NFT purchases are identity leaks (people buy\n  art matching their public tastes)\n- DeBank / Zerion — paste any address, see its entire portfolio across chains.\n  Free portfolio viewers feel like surveillance because functionally they are.\n- **Arkham Intelligence** — crowdsourced doxxed labels linking addresses to real\n  entities. Controversial, powerful, free tier exists.\n- **Breadcrumbs.app** — visual tracing graphs, hop-by-hop path mapping.\n\n## The OSINT crossover (your edge over pure chain analysts)\n\nWallet addresses leak into open sources constantly:\n\n- Bios and linktrees (\"Donations: 0xabc...\")\n- GitHub gists, pastes, forum signatures\n- Court filings and scam reports quoting addresses\n- NFT marketplace profiles with social links attached\n\nSearch any discovered address verbatim across Google/Bing/Yandex before doing\nchain work — someone may have already connected it to a name.\n\n## Honest limitations\n\n- **Monero**: effectively opaque by design. Say so; don\u0027t pretend.\n- **Mixers/tumblers** (Tornado Cash etc.) break direct trails; analysis shifts to\n  entry/exit points.\n- Chain-hopping (BTC→ETH→Monero) requires cross-chain inference — hard mode.\n- Exchange attribution stops at KYC walls: you prove funds reached Binance; only\n  legal process gets account names from there.\n\n## The line again\n\nTracing public ledger data: legitimate. Using found vulnerabilities or \"recovery\nservices\" that DM you after theft: those are second scams. Report theft to\nauthorities and exchanges\u0027 fraud desks; document everything for their processes.\n",
    "07-business-crypto/following-the-money.md":  "# Following the Money\n\nFinancial open sources go far beyond company registries. Property, courts,\nnonprofits, government spending — wealth leaves paper trails everywhere.\n\n## Real estate\n\nUS county records are shockingly open:\n\n- **County assessor/recorder websites** — deeds, sale prices, mortgage amounts,\n  liens, sometimes floor plans. Free, searchable by owner name in most counties.\n  Find the county via address → search owner name → find their OTHER properties.\n- **NYC ACRIS** — all city property transactions, free.\n- **UK Land Registry** — £7 per title document; ownership + price paid.\n- Zillow/Redfin history adds listing photos over time — see inside homes without\n  entering them (use lawfully).\n\n## Aviation \u0026 vessels as wealth markers\n\n- **FAA Registry** — every US-registered aircraft\u0027s owner, free, by tail number OR\n  owner name. Trust-fund jets, corporate shells owning planes — all listed.\n- **MarineTraffic/VesselFinder** — yacht positions live; hull registration lookups\n  give ownership chains through holding companies.\n\n## Nonprofits \u0026 foundations\n\n- **ProPublica Nonprofit Explorer** — every US nonprofit\u0027s IRS Form 990: salaries of\n  top staff, grants paid, board members. Free full-text search. Family foundations\n  quietly funding causes are mapped here in detail.\n- **Candid/GuideStar** — broader nonprofit profiles.\n\n## Government money\n\n- **USAspending.gov** — every federal contract/grant: who won, how much, what for.\n- **TED (ted.europa.eu)** — EU tender awards similarly.\n- Follow procurement: company wins contract → contract value funds the mansion the\n  county recorder just recorded. Chains like this build themselves.\n\n## Courts \u0026 debt\n\nBankruptcies, judgments, liens — PACER for federal, state portals elsewhere. A\nsubject\u0027s litigation history reveals business partners, disputes, and settlements\nthey\u0027d rather forget. Divorce filings especially leak financial detail.\n\n## Sanctions/PEP screening\n\nCovered in company-records.md via OpenSanctions — but remember adverse media\nsearching too: `\"[name]\" (fraud OR investigation OR indicted OR sued)` across news\narchives (GDELT, Google News date-filtered).\n\n## The mindset\n\nMoney investigations are chain-building: person → property → mortgage lender →\nrelated entity → new person. Every document names parties; every party gets searched;\nevery search yields documents. Tedious, legal, devastatingly effective.\n\n## The line\n\nAll above sources are official/public. Buying stolen financial records, bank\nstatement dumps, or \"fullz\" packages from criminal markets is not OSINT — it\u0027s\npossession of stolen goods with extra steps. The legitimate path is slower and it\nholds up in court.\n",
    "08-geospatial/maps-and-imagery.md":  "# Maps \u0026 Satellite Imagery\n\nGEOINT at scale. Where photo geolocation (05-images-video/) works single images,\nthis file covers area analysis, change detection, and mapping tools professionals\nlean on.\n\n## Satellite imagery\n\n- **Google Earth Pro** (free desktop app) — the historical imagery timeline slider is\n  criminally underused: scrub years to see construction appear, structures vanish,\n  terrain change. Also measures distances/areas precisely.\n- **Sentinel-2 via Copernicus Browser / Sentinel Hub Playground** — free 10m\n  resolution imagery refreshed every ~5 days globally. When Google\u0027s imagery is\n  stale, Sentinel is current. Bands beyond visible light (false-color vegetation,\n  burn scars) come free.\n- **Sentinel-1 radar** — sees through clouds and darkness. Conflict monitoring\n  depends on it.\n- **zoom.earth** — near-live weather satellite + wind maps. Timestamped weather\n  verification (\"was it really foggy that morning?\").\n- **Planet Labs** — daily whole-earth imaging; paid, but their free services show\n  event areas after disasters.\n\n## Change detection (the Bellingcat method)\n\nCompare pre-event vs post-event imagery of the same coordinates:\n\n1. Fix exact coordinates (geolocate first).\n2. Pull oldest available → newest imagery.\n3. Document changes: craters, vehicle scars on grass, disturbed earth, new\n  structures, burned areas.\n4. Corroborate with other sources before publishing conclusions.\n\nThis technique verified atrocities, missile strikes, and hidden construction sites\nwhen official sources said nothing.\n\n## Mapping platforms\n\n- **OpenStreetMap + Overpass Turbo** — queryable map database: \"all fuel stations\n  within 2km,\" \"every water tower in region X.\" Overpass queries answer questions\n  no GUI map can.\n- **Yandex Maps** — superior coverage/street-level in CIS countries.\n- **Apple Look Around** — surprisingly good in places Google lacks detail.\n- **Mapillary / KartaView** — crowdsourced street imagery where Google never drove:\n  rural roads, developing regions, recent coverage.\n- **Google Maps user photos** — contributors upload geotagged photos constantly;\n  free ground-truth imagery for specific spots.\n\n## Coordinate literacy\n\nLearn to read/convert: decimal degrees (DD), degrees-minutes-seconds (DMS), Plus\nCodes (Google\u0027s shareable grid), MGRS (military). Conversions via\n`coordinatesconverter.net` style tools. Wrong-format coordinates have embarrassed\nprofessionals publicly; double-check formats before citing.\n\n## Terrain tools\n\nPeakVisor (skyline ID), CalTopo (US terrain overlays), Wikimapia (old but has\nuser-labeled features nothing else marks).\n",
    "08-geospatial/planes-ships-vehicles.md":  "# Planes, Ships \u0026 Vehicles\n\nMoving assets broadcast their position constantly. Aircraft, vessels, and even\ntrains transmit tracking signals anyone can receive — and registries tie those\nassets to owners. This is GEOINT\u0027s real-time branch.\n\n## Aircraft\n\n**Tracking platforms:**\n\n- **ADS-B Exchange** — the investigator\u0027s choice: unfiltered, shows everything\n  including military and private flights other services hide\n- **FlightRadar24 / FlightAware** — friendlier UIs; FlightAware shows registration\n  history and routes by tail number\n- **globe.adsbexchange.com** — free web interface, no account needed\n\n**The registry pivot (the powerful part):**\n\n- **FAA Registry (registry.faa.gov)** — every US-registered aircraft: owner name,\n  address, registration history. Search by N-number OR owner name. Free.\n- Non-US registries vary; many are searchable (UK CAA, Transport Canada).\n\nFamous applications: celebrity jet trackers (the ElonJet saga), oligarch jet\nmonitoring after sanctions, identifying surveillance flights over protest areas.\n\n**Technique:** spot an interesting aircraft → tail number → FAA/registry → owner →\nshell company → corporate records (07-business-crypto/). The chain from \"plane\nlanded somewhere odd\" to \"owned by LLC X\" takes minutes.\n\n## Vessels\n\n- **MarineTraffic / VesselFinder** — AIS ship tracking: positions, ports, ownership\n  via IMO number lookup\n- **IMO number** = a ship\u0027s lifelong identity, more stable than names (ships get\n  renamed constantly to dodge sanctions/history)\n- **Equasis** — free ownership/management history for commercial ships\n- **ShipSpotting.com** — photo history per hull: who photographed it where, when\n\n**AIS spoofing is real:** Russian naval vessels famously transmitted fake positions\n(see the HMS Defender/Sevastopol incident). Cross-check AIS against satellite\nimagery and port cameras before trusting positions. Gaps in AIS coverage near\nsensitive locations tell their own stories.\n\n## Vehicles\n\n- **License plate lookups are legally restricted** (DPPA in the US limits who can\n  query DMV data). Paid aggregator sites exist in gray zones — know your local law.\n- **Plates as geolocation clues instead:** EU plates encode country + regional\n  codes; diplomatic plates use country codes (CD = corps diplomatique); US states\n  narrow regions. In photo geolocation, a readable plate often cracks the case.\n- **Parking apps / transit cameras**: not public sources; ignore anything requiring\n  improper access.\n\n## Trains \u0026 transit\n\n- **OpenRailwayMap** — infrastructure detail everywhere\n- Live train maps exist per country (rail forums maintain lists)\n- Train station appearances in photos geolocate well — stations are heavily\n  photographed landmarks with distinctive signage\n\n## The judgment note\n\nReal-time movement data of military forces during active conflicts is sensitive.\nPublishing precise positions of troops can get people killed — responsible\npractitioners think hard about amplification, delay, and aggregation before\nsharing. Technical capability never settles the publication question.\n",
    "09-dark-web/getting-started-safely.md":  "# Getting Started on the Dark Web Safely\n\nThe dark web isn\u0027t mysterious — it\u0027s websites reachable only through overlay networks,\nTor being the main one. Investigators monitor it for leaks, stolen data mentions,\nand threat activity. Here\u0027s how to do that without becoming a casualty.\n\n## Tor basics\n\n- Download **Tor Browser only from torproject.org**. It routes traffic through three\n  relays; .onion sites are hidden services inside that network.\n- Default settings are sensible. Don\u0027t maximize the window (fingerprinting), don\u0027t\n  install extra extensions, don\u0027t torrent through it.\n- **Never log into personal accounts over Tor casually** — you\u0027re associating your\n  identity with Tor usage at minimum, and exit-node traffic (non-onion sites) can be\n  observed.\n- Serious monitoring work: run Tor inside a VM (Whonix forces ALL traffic through\n  Tor — no accidental leaks).\n\n## Finding things\n\n**Search engines:**\n- **Ahmia.fi** — indexes onion services, usable from clearnet too. Cleanest start.\n- **Torch** — old, huge, noisy index of onions.\n- **Haystak** — large index, freemium.\n\n**Verification is critical:** phishing of onion addresses is rampant. **dark.fail**\nmaintains verified mirror lists for major services. Never trust onion links from\nsearch results alone when money/accounts are involved.\n\n## What\u0027s actually there (investigator-relevant)\n\n- **Ransomware leak sites** — groups publish stolen corporate data as extortion.\n  **ransomwatch / ransomware.live** track these from the clearnet so you often don\u0027t\n  need Tor at all for this class of monitoring.\n- **Data breach markets** — where stolen databases get sold. Monitor listings for\n  your organization\u0027s name; do NOT buy. Possession creates legal exposure and funds\n  the ecosystem you\u0027re defending against.\n- **Forums** — fraud/underground communities where threat actors talk. Accessing\n  public threads: research. Registering and engaging: undercover work with legal\n  implications requiring authorization.\n- **News/mirror services** — SecureDrop directories (whistleblower submission\n  systems), BBC/NYT onion mirrors for censored regions.\n\n## Bright lines\n\n1. Buying anything illegal = crime, full stop.\n2. CSAM: if encountered, stop, preserve nothing beyond minimal evidence, report\n   (NCMEC CyberTipline in US, INHOPE hotlines elsewhere).\n3. Engaging with fraud communities without authorization can constitute participation.\n4. Assume shock content exists; prepare accordingly.\n\n## Legitimate uses worth knowing\n\nChecking whether your own emails/data appear in breach discussions, organizational\nthreat monitoring, academic research, journalism, and accessing information under\ncensorship. The dark web is infrastructure — neutral until used.\n",
    "10-toolkit/building-your-rig.md":  "# Building Your Investigation Rig\n\nYour setup determines what you can safely do. Here\u0027s a pragmatic build path from\n\"curious beginner\" to \"handles sensitive engagements.\"\n\n## Level 1: Curious (costs nothing)\n\n- Firefox with **containers extension** — separate cookie jars per persona/context\n- Separate browser profile for investigations only: no personal extensions, autofill\n  off, history cleared aggressively\n- **uBlock Origin** — blocks trackers that would log your research behavior\n- Obsidian or Joplin for local case notes\n- A VPN if your threat model includes targets who check IPs\n\n## Level 2: Practitioner (~free, more discipline)\n\n- **VirtualBox or VMware Workstation Pro** (now free for personal use)\n- One VM per risk class: general research VM, hostile-target VM, sock-puppet VM\n- Snapshot before each engagement, roll back after\n- Password manager with separate vaults per persona (KeePassXC databases work well)\n- ExifTool, yt-dlp, gallery-dl installed in the VMs\n- Hunchly trial during real cases to feel what evidence-capture discipline adds\n\n## Level 3: Professional (when money/client work is involved)\n\n- Dedicated hardware for sensitive ops — never your daily driver\n- **Whonix** VMs for Tor-forced workflows (leak-proof by design)\n- Anti-detect browsers (Multilogin, GoLogin) when sock puppets must survive\n  fingerprinting — expensive but they solve problems containers can\u0027t\n- Mobile hotspot on an anonymized plan for network separation\n- Encrypted case storage: VeraCrypt containers, hashed evidence files, documented\n  chain of custody\n- Maltego CE or paid transforms for link analysis at scale\n\n## Sock puppet construction (the honest guide)\n\n1. Create email via different network than you\u0027ll use later\n2. Build persona doc: name, age, city, job, interests, writing style sample\n3. AI-generated profile photo (never a real person\u0027s face)\n4. Register platform accounts; let them AGE — weeks minimum before operational use\n5. Light normal activity: follow big accounts, occasional posts\n6. Never access two personas from the same session/browser fingerprint\n7. Never, ever cross-contaminate with your real identity\n\nPlatform TOS technically prohibits fake accounts everywhere. That\u0027s the accepted\ngray zone of the profession — document your justification per engagement.\n\n## Habits that matter more than gear\n\n- Screenshot everything immediately (URL bar + clock visible)\n- Archive pages as you read them (Save Page Now reflex)\n- Write findings same-day; memory lies\n- Hash evidence files (SHA-256) the moment they\u0027re saved\n- Keep an investigation log: timestamps, actions, queries run\n\nThe best rig in the world doesn\u0027t save an investigator who didn\u0027t document. Build\nthe habits first; upgrade the hardware when the work demands it.\n",
    "10-toolkit/the-big-tool-list.md":  "# The Big Tool List\n\nTools rot fast in this field — APIs die, sites block scrapers, projects get\nabandoned. This list favors durable classics and notes maintenance status. Check\nGitHub last-commit dates before trusting any tool\u0027s \"current\" status.\n\n## Frameworks \u0026 platforms\n\n| Tool | What it does | Status |\n|---|---|---|\n| **Maltego** | Link-analysis graphs + data transforms; the classic | Maintained (free CE tier) |\n| **SpiderFoot** | Automated recon across 200+ sources | Open source, active |\n| **Recon-ng** | Modular web recon framework | Active |\n| **theHarvester** | Emails/subdomains/hosts from public sources | Active |\n\n## People \u0026 identities\n\n- **WhatsMyName** — username enumeration (web + CLI via Sherlock/Maigret/Blackbird)\n- **Holehe** — email registration checks across 120+ sites\n- **Epieos** — Gmail/Microsoft account linkage from email addresses\n- **PhoneInfoga** — phone number footprint scanning\n- **PimEyes / FaceCheck.ID** — face search (paid tiers; ethics apply)\n\n## Social media\n\n- **Instaloader / gallery-dl** — archive Instagram/public media\n- **yt-dlp** — YouTube/media downloading incl. metadata+subtitles\n- **pullpush.io** — Reddit historical search API (Pushshift successor)\n- Twint/snscrape — X/Twitter: broken post-API changes; don\u0027t waste time\n\n## Infrastructure\n\n- **Shodan / Censys** — internet-connected device search\n- **SecurityTrails / ViewDNS / DNSDumpster** — DNS history and mapping\n- **crt.sh** — certificate transparency subdomain discovery\n- **Amass** — deep attack-surface enumeration (authorized engagements)\n- **PublicWWW** — source-code search (find shared analytics IDs, code reuse)\n- **Wappalyzer / BuiltWith** — website technology fingerprinting\n\n## Imagery \u0026 geolocation\n\n- **Google Earth Pro** — free desktop, historical imagery\n- **SunCalc** — shadow-based time/hemisphere analysis\n- **InVID-WeVerify extension** — video keyframe
