verification suite\n- **ExifTool** — the metadata standard\n- **FotoForensics** — ELA analysis (interpret carefully)\n\n## Archives \u0026 capture\n\n- **Wayback Machine + archive.today** — covered in their own file\n- **Hunchly** — paid but beloved: auto-captures every page during browsing with\n  hashes, built for evidentiary rigor. If investigations go legal, worth every cent.\n- **SingleFile extension** — one-click full-page saves\n\n## Aggregators \u0026 paid intel\n\n- **OSINT Industries** — email/phone enrichment used by pros (paid)\n- **IntelligenceX** — search engine covering leaks/dark web/onions (paid tiers;\n  evaluate legality of outputs for your jurisdiction)\n- **OCCRP Aleph** — free; leaks + registries for financial investigations\n\n## The meta-rule\n\nTools fail constantly. Manual methods (dorks, x-ray searches, archives) survive API\napocalypses. Learn the craft first; treat tools as accelerators, not crutches. When\na tool dies mid-investigation — and it will — the fundamentals carry you through.\n",
    "11-career/certifications.md":  "# Certifications — Getting the OSINT Title\n\nStraight talk: OSINT has no licensing board. Nobody legally \"is\" or \"isn\u0027t\" an\nOSINT professional. Certifications exist anyway, and they matter for one reason —\nHR departments and contractors need paper. Here\u0027s the honest landscape.\n\n## The certifications that carry weight\n\n### GOSI — GIAC Open Source Intelligence (the gold standard)\n\n- Backed by SANS via their **SEC497** course (\"Open-Source Intelligence\")\n- The cert employers actually recognize in government/contractor circles\n- Cost reality: SEC497 + GOSI attempt runs ~$8,000+ USD. Usually employer-funded.\n- A standalone GOSI exam attempt (~$1,000ish) exists but is genuinely hard without\n  the course structure\n- Open-book, proctored, hands-on practical questions\n\nIf someone pays for it, take it. If you\u0027re self-funding, read the rest first.\n\n### Michael Bazzell\u0027s training \u0026 book\n\n- *\"OSINT Techniques\"* (currently 12th edition) — the practitioner\u0027s bible,\n  ~$60. Working through every chapter IS a certification-grade education.\n- His personal privacy books pair with it if OPSEC interests you\n- No official cert attached; the community respect is the credential\n\n### OSINT Combine\n\n- Australian training company respected in government circles\n- Courses run periodically; not cheap but well-regarded regionally\n\n## Free/cheap credentials that actually signal skill\n\nThese aren\u0027t certificates — they\u0027re better, because they\u0027re verifiable:\n\n1. **Trace Labs CTF participation** — public leaderboards. Finishing events puts\n   your name on tracelabs.org permanently. Recruiters in this space check.\n2. **OSINT Dojo ranks** — free structured challenges, white through black belt,\n   verifiable badges.\n3. **TryHackMe OSINT path** — beginner scaffolding with completion badges. Good\n   first week; outgrow it fast.\n4. **Public writeups** — the true currency. One thorough sanitized case study on a\n   blog beats any badge in hiring conversations.\n\n## The recommended path (costs almost nothing)\n\n```\nWeeks 1–4:   This folder + TryHackMe OSINT path\nMonths 2–3:  GeoGuessr daily + Bellingcat exercises + Quiztime attempts\nMonth 4:     First Trace Labs event (public ones welcome newcomers)\nMonth 5+:    Write up everything you learned, publish, repeat\nOngoing:     Sector035\u0027s \"Week in OSINT\" newsletter to stay current\nWhen funded: GOSI for the HR checkbox\n```\n\n## What certs don\u0027t do\n\nThey don\u0027t teach judgment. They don\u0027t substitute for a portfolio. Nobody senior in\nthis field cares what certificate you hold — they care whether your writeups show\ndisciplined method, whether your Trace Labs submissions were verified, and whether\nyou can explain why you graded a source B3 instead of A2.\n\n## Bottom line\n\nTitle = portfolio + community presence + (optionally) one recognized cert for the\npaperwork people. Build in that order. The folder you\u0027re holding covers the first\npart completely — now go do the exercises instead of just reading them.\n",
    "11-career/practice-and-jobs.md":  "# Practice \u0026 Jobs\n\nSkill in this field comes from reps on real problems. Here\u0027s where to practice\nlegally, and where the paid work actually lives.\n\n## Practice venues\n\n**Trace Labs** (tracelabs.org) — CTFs where teams OSINT-search for real missing\npersons, submissions verified before forwarding to authorities. The best practice\nformat that exists: real stakes, real techniques, ethical frame. Free public events\nrun constantly; register early, they fill.\n\n**GeoGuessr** — daily challenges build the geolocation instinct faster than anything.\nCompetitive modes exist if you like suffering.\n\n**Quiztime** — professional geolocators post verification puzzles on X/Twitter.\nFollow the regulars; attempt before reading replies.\n\n**Bellingcat exercises** — published challenges from real investigations, plus their\nexcellent free guides. Their Discord/community discusses technique openly.\n\n**r/OSINT** — case discussions, tool news, occasional collaborative mysteries.\nQuality varies; the weekly threads are useful.\n\n**OSINT Dojo** — free structured ranks (white → black belt) with practical\nchallenges per level. Good gap-filler between beginner resources and real work.\n\n**HackTheBox Sherlocks** — defensive investigation scenarios blending OSINT with\nforensics. Closer to blue-team work but builds rigor.\n\n## Where the jobs are\n\n| Sector | Roles | Notes |\n|---|---|---|\n| **Corporate threat intel** | Analyst, Intel Manager | Most common path; SOC-adjacent |\n| **Fraud/AML (banks, fintech)** | Investigator | Stable, well-paid, regulatory-driven demand |\n| **Trust \u0026 Safety (big tech)** | Investigator | Platform abuse, influence ops |\n| **Journalism** | Verification/Investigative | Bellingcat model; portfolio-driven |\n| **Insurance** | SIU Investigator | Underappreciated niche; steady |\n| **Law enforcement/Gov** | Analyst | Requires citizenship/clearances usually |\n| **Private investigation** | PI | License territory varies by jurisdiction |\n| **Red team recon** | Offensive security | OSINT as phase one of pentesting |\n\n## Getting noticed (the real game)\n\n1. **Public writeups** — sanitized case studies showing your method. One good\n   writeup of tracing a scam network beats ten certificates in hiring conversations.\n2. **Tool contributions** — even documentation PRs to WhatsMyName/Sherlock get your\n   name in the community.\n3. **CTF rankings** — Trace Labs leaderboards are public and checked.\n4. **Conference talks** — local BSides chapters welcome OSINT talks; recording goes\n   on your profile forever.\n5. **Newsletter presence** — responding to Quiztime puzzles publicly, being visibly\n   correct, compounds over time.\n\n## Salary reality\n\nVaries wildly by region/sector: fraud analyst roles start modest; senior threat\nintel and T\u0026S investigator roles at major tech pay tech salaries; elite consulting\ncommands premium rates. The differentiator at every level is demonstrated judgment,\nnot tool count.\n\n## The uncomfortable truth about entry\n\nNobody hires \"OSINT person\" fresh with zero portfolio. Everyone starts adjacent —\nSOC analyst who does recon well, journalist who verifies well, fraud analyst who\nfinds people well — then converges. Pick your adjacent door and walk through it\nwith this folder\u0027s skills already loaded.\n",
    "12-methodology/writing-it-up.md":  "# Writing It Up\n\nCollection without communication is just browsing. The final skill — the one that\nseparates professionals from hobbyists — is turning findings into intelligence\nproducts people can trust and act on.\n\n## Structure that works\n\n**1. BLUF — Bottom Line Up Front.** Key assessments in the first three lines.\nDecision-makers read nothing else if you bury the answer on page four.\n\n**2. Scope \u0026 methodology.** What question were you answering, what sources did you\nuse, what did you deliberately not do. This section is what makes findings auditable.\n\n**3. Findings with confidence levels.** Each finding: the claim, the evidence, the\nconfidence, the source reliability.\n\n**4. Gaps \u0026 limitations.** What you couldn\u0027t determine and why. Stating gaps builds\nmore credibility than pretending completeness.\n\n**5. Appendices.** Evidence log: screenshots with URLs/timestamps, archive links,\nhashes of key files.\n\n## Confidence language (ICD-203 standard)\n\nUse these terms precisely — they have agreed probability ranges:\n\n| Term | Probability |\n|---|---|\n| Almost certainly | 95–99% |\n| Highly likely | 80–95% |\n| Likely / probably | 55–80% |\n| Roughly/even chance | 40–55% |\n| Unlikely | 20–40% |\n| Very unlikely | 5–20% |\n\nNever write \"definitely\" unless you have documentary proof. Never let a hunch wear\nthe costume of a finding.\n\n## Source grading (Admiralty code)\n\nGrade every source on two axes:\n\n- **Reliability** (A–F): A = proven reliable historically ... E = unknown, F = can\u0027t judge\n- **Credibility** (1–6): 1 = confirmed by other sources ... 5 = implausible, 6 = can\u0027t judge\n\n\"Source B2\" notation in your evidence log tells readers exactly how much weight each\nbrick holds.\n\n## Separation discipline\n\nLabel everything as one of:\n\n- **Fact** — verifiable, evidenced (\"Domain registered 2023-03-14 via Namecheap\")\n- **Analysis** — your reasoning from facts (\"Registration timing precedes campaign\n  launch by two weeks\")\n- **Assumption** — taken as true for the analysis but unverified (\"Assuming the\n  operator reuses infrastructure\")\n\nMixing these is how innocent people get defamed and reports get shredded in court.\nKeep them visibly separate.\n\n## Attribution humility\n\nClaiming \"Account X is operated by Person Y\" requires convergent evidence: multiple\nindependent pivots agreeing (username + photo + writing style + timeline + network\noverlap). One matching username is a lead, never a conclusion. State what would\nchange your mind — falsifiability reads as rigor, not weakness.\n\n## Visual products\n\n- **Timelines** for chronology-heavy cases\n- **Link charts** (Maltego/draw.io) for networks — label edges with the evidence\n  supporting each connection; unlabeled edges are decoration\n- **Maps** with numbered annotations for geolocation cases\n\n## The test\n\nHand your report to someone unfamiliar with the case. If they can state the key\nfindings, how confident to be, and what evidence backs it — without asking you a\nsingle question — it\u0027s done. If they ask \"how do you know?\", your methodology\nsection failed. Fix and repeat until silent.\n"
